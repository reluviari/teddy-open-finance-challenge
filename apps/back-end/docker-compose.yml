services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teddy
      POSTGRES_PASSWORD: teddy
      POSTGRES_DB: teddy
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teddy']
      interval: 5s
      timeout: 3s
      retries: 5

  back-end:
    build:
      context: ../..
      dockerfile: apps/back-end/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
