name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/back-end/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/back-end/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teddy
          POSTGRES_PASSWORD: teddy
          POSTGRES_DB: teddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: teddy
      DATABASE_PASSWORD: teddy
      DATABASE_NAME: teddy
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: NX_DAEMON=false npx nx lint back-end

      - name: Unit tests
        run: NX_DAEMON=false npx nx test back-end

      - name: E2E tests
        run: NX_DAEMON=false npm run test:e2e:back

      - name: Build
        run: NX_DAEMON=false npx nx build back-end
