name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/back-end/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/back-end/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx nx lint back-end

      - name: Test
        run: npx nx test back-end

      - name: Build
        run: npx nx build back-end
